{% extends "base.html" %}

{% block titulo %}Novo Treinador{% endblock %}

{% block conteudo %}

<div class="mb-6">
    <a href="/treinadores" class="text-orange-500 hover:text-orange-600 text-sm">← Voltar aos treinadores</a>
    <h1 class="text-2xl font-bold text-gray-800 mt-2">Novo Treinador</h1>
</div>

<div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100 max-w-2xl">
    <form method="POST" action="/treinadores/novo">

        <!-- Nome -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Nome completo *</label>
            <input type="text" name="nome" placeholder="Nome do treinador"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400"
                   required>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <!-- Data de nascimento -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Data de nascimento</label>
                <input type="date" name="data_nascimento"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400">
            </div>

            <!-- Telefone -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Telefone</label>
                <input type="text" name="telefone" placeholder="912 345 678"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400">
            </div>
        </div>

        <!-- Email -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" name="email" placeholder="email@exemplo.com"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400">
        </div>

        <!-- Morada -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Morada</label>
            <input type="text" name="morada" placeholder="Rua, número, cidade"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <!-- Número cédula -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Nº Cédula</label>
                <input type="text" name="numero_cedula" placeholder="Número de cédula"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400">
            </div>

            <!-- Número FPB -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Nº FPB</label>
                <input type="text" name="numero_fpb" placeholder="Número FPB"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400">
            </div>
        </div>

        <!-- Equipas -->
        {% if equipas %}
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Equipas associadas</label>
            <div class="space-y-2">
                {% for equipa in equipas %}
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" name="equipas_ids" value="{{ equipa.id }}"
                           class="w-4 h-4 text-orange-500 rounded">
                    <span class="text-gray-700">{{ equipa.nome }} — {{ equipa.escalao.value }}</span>
                </label>
                {% endfor %}
            </div>
        </div>
        {% endif %}

        <!-- Observações -->
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-1">Observações</label>
            <textarea name="observacoes" rows="3" placeholder="Notas adicionais..."
                      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400"></textarea>
        </div>

        <div class="flex gap-3">
            <button type="submit"
                    class="bg-orange-500 hover:bg-orange-600 text-white px-6 py-2 rounded-lg font-medium transition">
                Registar Treinador
            </button>
            <a href="/treinadores"
               class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-6 py-2 rounded-lg font-medium transition">
                Cancelar
            </a>
        </div>

    </form>
</div>

{% endblock %}
