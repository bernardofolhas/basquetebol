<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova palavra-passe</title><script src="https://cdn.tailwindcss.com"></script></head><body class="flex min-h-screen items-center justify-center bg-slate-100 p-4"><main class="w-full max-w-md rounded-2xl bg-white p-8 shadow-lg"><p class="text-xs font-bold uppercase tracking-widest text-orange-600">Ligação protegida</p><h1 class="mt-2 text-2xl font-bold text-slate-900">Definir nova palavra-passe</h1>{% if token_invalido %}<div class="mt-5 rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-800">Esta ligação é inválida, expirou ou já foi utilizada.</div><a href="/recuperar-password" class="mt-5 block text-center font-semibold text-orange-600">Pedir nova ligação</a>{% else %}{% if erros %}<div class="mt-5 rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-800">{% for erro in erros %}<p>{{ erro }}</p>{% endfor %}</div>{% endif %}<form method="POST" class="mt-6 space-y-4"><input type="hidden" name="csrf_token" value="{{ request.session.get('_csrf', '') }}"><label class="block text-sm font-semibold text-slate-700">Nova palavra-passe<input type="password" name="password_nova" required minlength="10" autocomplete="new-password" class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-3"></label><label class="block text-sm font-semibold text-slate-700">Confirmar palavra-passe<input type="password" name="password_confirmar" required minlength="10" autocomplete="new-password" class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-3"></label><p class="text-xs text-slate-500">Utiliza pelo menos 10 caracteres, com letras e números.</p><button class="w-full rounded-xl bg-orange-600 px-4 py-3 font-semibold text-white hover:bg-orange-700">Alterar palavra-passe</button></form>{% endif %}</main></body></html>
