{% extends "base.html" %}

{% block titulo %}Novo Macrociclo — {{ equipa.nome }}{% endblock %}

{% block conteudo %}

<div class="mb-6">
    <a href="/planeamento/equipas/{{ equipa.id }}/macrociclos"
       class="text-orange-500 hover:text-orange-600 text-sm">
        ← Voltar aos macrociclos
    </a>
    <h1 class="text-2xl font-bold text-gray-800 mt-2">
        Macrociclo {{ proximo_numero }} — {{ equipa.nome }}
    </h1>
</div>

<form method="POST" action="/planeamento/equipas/{{ equipa.id }}/macrociclos/novo">
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">

    <!-- Informações básicas -->
    <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
        <h2 class="font-semibold text-gray-700 mb-4">Informações Básicas</h2>

        <!-- Campo apenas de leitura — o número é automático -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Número do Macrociclo</label>
            <input type="text" value="Macrociclo {{ proximo_numero }}" disabled
                   class="w-full px-4 py-2 border border-gray-200 rounded-lg bg-gray-50 text-gray-500">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Data de início *</label>
                <input type="date" name="data_inicio" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Data de fim *</label>
                <input type="date" name="data_fim" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400">
            </div>
        </div>
    </div>

    <!-- Objetivos técnicos/táticos -->
    <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
        <h2 class="font-semibold text-gray-700 mb-4">Objetivos Técnicos/Táticos</h2>

        <!-- TIO — Técnica Individual Ofensiva -->
        <div class="mb-3">
            <label class="block text-xs font-semibold text-blue-600 mb-1">
                Técnica Individual Ofensiva (TIO)
            </label>
            <textarea name="obj_tecnica_individual_ofensiva" rows="2"
                      placeholder="Objetivos de técnica individual ofensiva..."
                      class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-400"></textarea>
        </div>

        <!-- TID — Técnica Individual Defensiva -->
        <div class="mb-3">
            <label class="block text-xs font-semibold text-blue-600 mb-1">
                Técnica Individual Defensiva (TID)
            </label>
            <textarea name="obj_tecnica_individual_defensiva" rows="2"
                      placeholder="Objetivos de técnica individual defensiva..."
                      class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-400"></textarea>
        </div>

        <!-- TaIO — Tática Individual Ofensiva -->
        <div class="mb-3">
            <label class="block text-xs font-semibold text-green-600 mb-1">
                Tática Individual Ofensiva (TaIO)
            </label>
            <textarea name="obj_tatica_individual_ofensiva" rows="2"
                      placeholder="Objetivos de tática individual ofensiva..."
                      class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-400"></textarea>
        </div>

        <!-- TaID — Tática Individual Defensiva -->
        <div class="mb-3">
            <label class="block text-xs font-semibold text-green-600 mb-1">
                Tática Individual Defensiva (TaID)
            </label>
            <textarea name="obj_tatica_individual_defensiva" rows="2"
                      placeholder="Objetivos de tática individual defensiva..."
                      class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-400"></textarea>
        </div>

        <!-- TCO — Tática Coletiva Ofensiva -->
        <div class="mb-3">
            <label class="block text-xs font-semibold text-orange-600 mb-1">
                Tática Coletiva Ofensiva (TCO)
            </label>
            <textarea name="obj_tatica_coletiva_ofensiva" rows="2"
                      placeholder="Objetivos de tática coletiva ofensiva..."
                      class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-400"></textarea>
        </div>

        <!-- TCD — Tática Coletiva Defensiva -->
        <div class="mb-3">
            <label class="block text-xs font-semibold text-orange-600 mb-1">
                Tática Coletiva Defensiva (TCD)
            </label>
            <textarea name="obj_tatica_coletiva_defensiva" rows="2"
                      placeholder="Objetivos de tática coletiva defensiva..."
                      class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-400"></textarea>
        </div>
    </div>

    <!-- Objetivos físicos e psicológicos -->
    <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100 md:col-span-2">
        <h2 class="font-semibold text-gray-700 mb-4">Outros Objetivos</h2>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold text-purple-600 mb-1">Físicos</label>
                <textarea name="obj_fisicos" rows="3"
                          placeholder="Objetivos físicos..."
                          class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-400"></textarea>
            </div>
            <div>
                <label class="block text-xs font-semibold text-yellow-600 mb-1">Psicológicos</label>
                <textarea name="obj_psicologicos" rows="3"
                          placeholder="Objetivos psicológicos..."
                          class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-400"></textarea>
            </div>
        </div>
    </div>

</div>

<!-- Botões de acção -->
<div class="flex gap-3 mt-6">
    <button type="submit"
            class="bg-orange-500 hover:bg-orange-600 text-white px-6 py-2 rounded-lg font-medium transition">
        Criar Macrociclo
    </button>
    <a href="/planeamento/equipas/{{ equipa.id }}/macrociclos"
       class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-6 py-2 rounded-lg font-medium transition">
        Cancelar
    </a>
</div>

</form>

{% endblock %}
