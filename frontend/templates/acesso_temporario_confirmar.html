<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Confirmar acesso temporário</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen items-center justify-center bg-slate-100 p-4">
  <main class="w-full max-w-md rounded-2xl bg-white p-8 shadow-lg">
    <p class="text-xs font-bold uppercase tracking-widest text-slate-500">Recuperação administrativa</p>
    <h1 class="mt-2 text-2xl font-bold text-slate-900">Confirmar acesso temporário</h1>
    <p class="mt-3 text-sm leading-6 text-slate-600">Vais entrar na conta de {{ utilizador_alvo.nome }}. A ligação será consumida e terás de definir imediatamente uma nova palavra-passe.</p>
    <form method="POST" action="/acesso-temporario/{{ token }}" class="mt-6">
      <input type="hidden" name="csrf_token" value="{{ request.session.get('_csrf', '') }}">
      <button type="submit" class="w-full rounded-xl bg-slate-800 px-5 py-3 font-semibold text-white hover:bg-slate-700 focus:outline-none focus:ring-4 focus:ring-slate-300">Confirmar e continuar</button>
    </form>
    <a href="/login" class="mt-4 block text-center text-sm font-semibold text-slate-600">Cancelar</a>
  </main>
</body>
</html>
