{% extends "base.html" %}

{% block titulo %}Nova Equipa{% endblock %}

{% block conteudo %}

<div class="mb-6">
    <a href="/equipas" class="text-orange-500 hover:text-orange-600 text-sm">← Voltar às equipas</a>
    <h1 class="text-2xl font-bold text-gray-800 mt-2">Nova Equipa</h1>
</div>

<div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100 max-w-2xl">
    <form method="POST" action="/equipas/nova">

        <!-- Nome -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Nome da equipa *</label>
            <input type="text" name="nome" placeholder="Ex: Masculinos Sub-14"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400"
                   required>
        </div>

        <!-- Escalão -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Escalão *</label>
            <select name="escalao"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400"
                    required>
                <option value="">Selecciona um escalão</option>
                {% for escalao in escaloes %}
                <option value="{{ escalao.value }}">{{ escalao.value }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Género -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Género *</label>
            <select name="genero"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400"
                    required>
                <option value="">Selecciona o género</option>
                {% for genero in generos %}
                <option value="{{ genero.value }}">{{ genero.value }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Seccionista -->
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-1">Seccionista</label>
            <input type="text" name="seccionista" placeholder="Nome do seccionista (opcional)"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400">
        </div>

        <div class="flex gap-3">
            <button type="submit"
                    class="bg-orange-500 hover:bg-orange-600 text-white px-6 py-2 rounded-lg font-medium transition">
                Criar Equipa
            </button>
            <a href="/equipas"
               class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-6 py-2 rounded-lg font-medium transition">
                Cancelar
            </a>
        </div>

    </form>
</div>

{% endblock %}
