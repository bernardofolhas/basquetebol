{% extends "base.html" %}

{% block titulo %}Novo Jogador{% endblock %}

{% block conteudo %}

<div class="mb-6">
    <a href="/jogadores" class="text-orange-500 hover:text-orange-600 text-sm">← Voltar aos jogadores</a>
    <h1 class="text-2xl font-bold text-gray-800 mt-2">Novo Jogador</h1>
</div>

<form method="POST" action="/jogadores/novo">
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">

    <!-- Informações básicas -->
    <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
        <h2 class="font-semibold text-gray-700 mb-4">Informações Básicas</h2>

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Nome completo *</label>
            <input type="text" name="nome" placeholder="Nome do jogador"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400"
                   required>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Data de nascimento</label>
                <input type="date" name="data_nascimento"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Naturalidade</label>
                <input type="text" name="naturalidade" placeholder="Cidade"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400">
            </div>
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Morada</label>
            <input type="text" name="morada" placeholder="Rua, número, cidade"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Nº Camisola</label>
                <input type="number" name="numero_camisola" placeholder="Ex: 10"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Posição</label>
                <select name="posicao"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400">
                    <option value="">Selecciona</option>
                    <option value="Base">Base</option>
                    <option value="Extremo">Extremo</option>
                    <option value="Poste">Poste</option>
                </select>
            </div>
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Equipa</label>
            <select name="equipa_id"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400">
                <option value="">Sem equipa</option>
                {% for equipa in equipas %}
                <option value="{{ equipa.id }}">{{ equipa.nome }} — {{ equipa.escalao.value }}</option>
                {% endfor %}
            </select>
        </div>
    </div>

    <!-- Contactos -->
    <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
        <h2 class="font-semibold text-gray-700 mb-4">Contactos</h2>

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Telefone</label>
            <input type="text" name="telefone" placeholder="912 345 678"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400">
        </div>

        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" name="email" placeholder="email@exemplo.com"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400">
        </div>

        <h3 class="font-medium text-gray-600 mb-3 pt-3 border-t border-gray-100">Contacto do Pai</h3>

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Nome do pai</label>
            <input type="text" name="nome_pai" placeholder="Nome completo"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400">
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Telefone</label>
                <input type="text" name="telefone_pai"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" name="email_pai"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400">
            </div>
        </div>

        <h3 class="font-medium text-gray-600 mb-3 pt-3 border-t border-gray-100">Contacto da Mãe</h3>

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Nome da mãe</label>
            <input type="text" name="nome_mae" placeholder="Nome completo"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400">
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Telefone</label>
                <input type="text" name="telefone_mae"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" name="email_mae"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400">
            </div>
        </div>
    </div>

</div>

<!-- Botões fora das colunas -->
<div class="flex gap-3 mt-6">
    <button type="submit"
            class="bg-orange-500 hover:bg-orange-600 text-white px-6 py-2 rounded-lg font-medium transition">
        Registar Jogador
    </button>
    <a href="/jogadores"
       class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-6 py-2 rounded-lg font-medium transition">
        Cancelar
    </a>
</div>

</form>

{% endblock %}
