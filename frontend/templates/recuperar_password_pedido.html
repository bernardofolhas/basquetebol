<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar palavra-passe</title><script src="https://cdn.tailwindcss.com"></script></head><body class="flex min-h-screen items-center justify-center bg-slate-100 p-4"><main class="w-full max-w-md rounded-2xl bg-white p-8 shadow-lg"><p class="text-xs font-bold uppercase tracking-widest text-orange-600">Acesso seguro</p><h1 class="mt-2 text-2xl font-bold text-slate-900">Recuperar palavra-passe</h1><p class="mt-2 text-sm text-slate-500">Indica o email ou nome de utilizador associado à conta.</p>{% if mensagem %}<div class="mt-5 rounded-xl border border-emerald-200 bg-emerald-50 p-4 text-sm text-emerald-800">{{ mensagem }}</div>{% else %}<form method="POST" class="mt-6 space-y-4"><input type="hidden" name="csrf_token" value="{{ request.session.get('_csrf', '') }}"><label class="block text-sm font-semibold text-slate-700">Email ou utilizador<input name="identificador" required autocomplete="username" class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-3 focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-200"></label><button class="w-full rounded-xl bg-orange-600 px-4 py-3 font-semibold text-white hover:bg-orange-700 focus:outline-none focus:ring-4 focus:ring-orange-200">Enviar ligação segura</button></form>{% endif %}<a href="/login" class="mt-5 block text-center text-sm font-medium text-slate-600 hover:text-orange-600">Voltar ao login</a></main></body></html>
