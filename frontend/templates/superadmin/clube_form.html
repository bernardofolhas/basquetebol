{% extends "base.html" %}
{% block titulo %}Criar clube{% endblock %}
{% block conteudo %}
<div class="mx-auto max-w-4xl">
  <h1 class="text-3xl font-bold">Criar clube</h1><p class="mt-1 text-gray-500">O clube fica pronto a usar com identidade e administrador principal.</p>
  {% if erro %}<div class="mt-5 rounded-xl border border-red-200 bg-red-50 p-4 text-red-800">{{ erro }}</div>{% endif %}
  <form method="POST" enctype="multipart/form-data" class="mt-6 space-y-6">
    <section class="rounded-2xl bg-white p-6 shadow-sm"><h2 class="text-lg font-bold">1. Identificação</h2><div class="mt-4 grid gap-4 md:grid-cols-2"><label class="text-sm font-semibold">Nome oficial<input name="nome_oficial" required class="mt-1 w-full rounded-lg border p-3"></label><label class="text-sm font-semibold">Nome curto<input name="nome_curto" required class="mt-1 w-full rounded-lg border p-3"></label><label class="text-sm font-semibold">Identificador único<input name="identificador" placeholder="gerado pelo nome curto" class="mt-1 w-full rounded-lg border p-3"></label><label class="text-sm font-semibold">Época inicial<input name="epoca_inicial" placeholder="2026/2027" class="mt-1 w-full rounded-lg border p-3"></label></div></section>
    <section class="rounded-2xl bg-white p-6 shadow-sm"><h2 class="text-lg font-bold">2. Identidade visual</h2><div class="mt-4 grid gap-4 sm:grid-cols-3"><label class="text-sm font-semibold">Principal<input type="color" name="cor_principal" value="#f97316" class="mt-1 h-12 w-full rounded-lg border"></label><label class="text-sm font-semibold">Secundária<input type="color" name="cor_secundaria" value="#1f2937" class="mt-1 h-12 w-full rounded-lg border"></label><label class="text-sm font-semibold">Destaque<input type="color" name="cor_destaque" value="#0ea5e9" class="mt-1 h-12 w-full rounded-lg border"></label></div><div class="mt-5 grid gap-4 md:grid-cols-2"><label class="text-sm font-semibold">Logótipo principal<input type="file" name="logo_principal" accept="image/png,image/jpeg" class="mt-1 block w-full rounded-lg border p-2"><span class="mt-1 block text-xs font-normal text-gray-500">PNG ou JPEG, máximo 2 MB.</span></label><label class="text-sm font-semibold">Logótipo secundário <span class="font-normal text-gray-500">(opcional)</span><input type="file" name="logo_secundario" accept="image/png,image/jpeg" class="mt-1 block w-full rounded-lg border p-2"><span class="mt-1 block text-xs font-normal text-gray-500">Usado em documentos e cabeçalhos quando necessário.</span></label></div></section>
    <section class="rounded-2xl bg-white p-6 shadow-sm"><h2 class="text-lg font-bold">3. Administrador principal</h2><div class="mt-4 grid gap-4 md:grid-cols-2"><label class="text-sm font-semibold">Nome<input name="admin_nome" required class="mt-1 w-full rounded-lg border p-3"></label><label class="text-sm font-semibold">Email<input type="email" name="admin_email" required class="mt-1 w-full rounded-lg border p-3"></label><label class="text-sm font-semibold">Username<input name="admin_username" required class="mt-1 w-full rounded-lg border p-3"></label><label class="text-sm font-semibold">Password inicial<input type="password" name="admin_password" minlength="8" required class="mt-1 w-full rounded-lg border p-3"><span class="mt-1 block text-xs font-normal text-gray-500">Será obrigatório alterá-la no primeiro acesso.</span></label></div></section>
    <button class="rounded-xl bg-orange-600 px-6 py-3 font-bold text-white">Criar e ativar clube</button>
  </form>
</div>
{% endblock %}
