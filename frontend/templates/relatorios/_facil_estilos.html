<style>
@page{size:A4 {{ 'landscape' if orientacao == 'paisagem' else 'portrait' }};margin:11mm}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#172033;font-size:10px;line-height:1.35}.easy-intro{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px;color:#64748b}.easy-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.easy-card{padding:10px;border:1px solid #dbe3ee;border-radius:10px;background:#fff;page-break-inside:avoid;box-shadow:0 2px 0 #e2e8f0}.easy-card h2,.easy-card h3{margin:0 0 5px;color:var(--pdf-primary-dark)}.easy-photo{width:58px;height:66px;object-fit:cover;border-radius:8px;background:#e2e8f0}.easy-avatar{display:grid;place-items:center;width:58px;height:66px;border-radius:8px;background:#e2e8f0;color:#64748b;font-weight:800;font-size:16px}.easy-person{display:grid;grid-template-columns:58px 1fr;gap:8px}.easy-meta{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}.easy-meta span{padding:2px 5px;border-radius:999px;background:var(--pdf-primary-light);font-weight:700}.easy-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:7px}.easy-stat{padding:5px 3px;text-align:center;border-radius:6px;background:var(--pdf-primary-light)}.easy-stat b,.easy-stat small{display:block}.easy-stat b{font-size:13px;color:var(--pdf-primary-dark)}.easy-stat small{font-size:7px;text-transform:uppercase}.easy-section{margin:0 0 10px;page-break-inside:avoid}.easy-section>h2{margin:0 0 6px;padding-left:7px;border-left:4px solid var(--pdf-primary);font-size:14px}.easy-lineup{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.easy-lineup .easy-card{text-align:center;padding:6px}.easy-lineup .easy-photo,.easy-lineup .easy-avatar{width:100%;height:62px}.easy-lineup strong,.easy-lineup small{display:block}.easy-lineup small{color:#64748b}.easy-brief{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.easy-brief .easy-card{border-top:4px solid var(--pdf-primary)}.easy-list{margin:5px 0 0;padding:0;list-style:none}.easy-list li{margin-top:4px;padding:5px 6px;border-radius:6px;background:#f8fafc}.easy-list b{color:var(--pdf-primary-dark)}.easy-message{padding:12px;border-radius:10px;background:var(--pdf-primary-light);border:1px solid var(--pdf-primary-border);font-size:12px;font-weight:700;white-space:pre-line}.easy-empty{padding:20px;text-align:center;color:#64748b;border:1px dashed #cbd5e1;border-radius:10px}.easy-roster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.easy-roster .easy-stats{grid-column:1/-1}.muted{color:#64748b}.text{white-space:pre-line}
