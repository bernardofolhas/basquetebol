<style>
@page{size:A4 {{ 'landscape' if orientacao == 'paisagem' else 'portrait' }};margin:11mm}
*{box-sizing:border-box}body{margin:0;color:var(--pdf-ink);font-size:10px;line-height:1.4}.easy-intro{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:5px 0 13px;color:var(--pdf-muted)}.easy-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.easy-card{padding:10px;border:1px solid var(--pdf-line);border-radius:10px;background:linear-gradient(145deg,#fff,#fafbfd);page-break-inside:avoid}.easy-card h2,.easy-card h3{margin:0 0 5px;color:var(--pdf-ink)}.easy-photo{width:58px;height:66px;object-fit:cover;border:1px solid var(--pdf-line);border-radius:9px;background:#e2e8f0}.easy-avatar{display:grid;place-items:center;width:58px;height:66px;border-radius:9px;background:linear-gradient(145deg,#e8edf3,#d9e2ec);color:#64748b;font-weight:850;font-size:16px}.easy-person{display:grid;grid-template-columns:58px 1fr;gap:9px}.easy-meta{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}.easy-meta span{padding:2px 6px;border:1px solid var(--pdf-primary-border);border-radius:999px;background:var(--pdf-primary-light);font-weight:750}.easy-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:7px}.easy-stat{padding:6px 3px;text-align:center;border:1px solid var(--pdf-line);border-radius:7px;background:var(--pdf-surface)}.easy-stat b,.easy-stat small{display:block}.easy-stat b{font-size:13px;color:var(--pdf-ink)}.easy-stat small{margin-top:1px;color:var(--pdf-muted);font-size:7px;font-weight:800;text-transform:uppercase}.easy-section{margin:0 0 11px;page-break-inside:avoid}.easy-section>h2{margin:0 0 7px;padding:5px 8px;border-left:4px solid var(--pdf-primary);border-radius:0 6px 6px 0;background:linear-gradient(90deg,var(--pdf-primary-light),var(--pdf-surface));font-size:14px}.easy-lineup{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.easy-lineup .easy-card{text-align:center;padding:6px}.easy-lineup .easy-photo,.easy-lineup .easy-avatar{width:100%;height:62px}.easy-lineup strong,.easy-lineup small{display:block}.easy-lineup small{color:var(--pdf-muted)}.easy-brief{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.easy-brief .easy-card{border-top:4px solid var(--pdf-primary)}.easy-list{margin:5px 0 0;padding:0;list-style:none}.easy-list li{margin-top:4px;padding:6px 7px;border-left:3px solid var(--pdf-primary);border-radius:0 6px 6px 0;background:var(--pdf-surface)}.easy-list b{color:var(--pdf-primary-dark)}.easy-message{padding:12px;border-radius:10px;background:var(--pdf-primary-light);border:1px solid var(--pdf-primary-border);font-size:12px;font-weight:750;white-space:pre-line}.easy-empty{padding:20px;text-align:center;color:var(--pdf-muted);border:1px dashed #cbd5e1;border-radius:10px;background:var(--pdf-surface)}.easy-roster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.easy-roster .easy-stats{grid-column:1/-1}.muted{color:var(--pdf-muted)}.text{white-space:pre-line}
.easy-card h2{font-size:12px;line-height:1.15}.easy-card h3{font-size:11px;line-height:1.2}.easy-person{grid-template-columns:58px minmax(0,1fr);overflow:hidden}.easy-photo{display:block;max-width:100%}.easy-roster{grid-template-columns:repeat({{ 3 if orientacao == 'paisagem' else 2 }},minmax(0,1fr))}.easy-meta span{white-space:nowrap}
</style>
