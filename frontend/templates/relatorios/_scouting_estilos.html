<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--pdf-ink);font-family:Aptos,"Segoe UI",Arial,sans-serif;font-size:9px;line-height:1.42;font-variant-numeric:tabular-nums}
h1,h2,h3,p{margin-top:0}
.scouting-report-header{display:grid;grid-template-columns:18mm minmax(0,1fr) 18mm;align-items:center;gap:5mm;min-height:24mm;margin-bottom:6mm;border-radius:3mm;background:var(--pdf-primary);padding:3mm 4mm;color:var(--pdf-on-primary);page-break-inside:avoid}.scouting-report-header h1{margin:0;color:var(--pdf-on-primary);font-size:17px;line-height:1.1;text-align:center}.scouting-report-logo{display:grid;width:18mm;height:18mm;place-items:center;border-radius:0;background:transparent}.scouting-report-logo:empty{background:transparent}.scouting-report-logo img{display:block;width:17mm;height:17mm;object-fit:contain}
.scout-cover{position:relative;overflow:hidden;display:flex;min-height:39mm;align-items:flex-end;justify-content:space-between;gap:12mm;margin-bottom:7mm;border:0;border-radius:4mm;padding:8mm;background:linear-gradient(118deg,var(--pdf-primary-dark),var(--pdf-primary));color:var(--pdf-on-primary);page-break-inside:avoid}
.scout-cover::before{position:absolute;inset:0 auto 0 0;width:1.4mm;background:linear-gradient(var(--pdf-on-primary),var(--pdf-accent));content:""}.scout-cover::after{position:absolute;right:-11mm;bottom:-17mm;width:43mm;height:43mm;border:7mm solid var(--pdf-on-primary);border-radius:50%;content:"";opacity:.24}.scout-cover>*{position:relative;z-index:1}
.scout-cover h1{margin:0;color:var(--pdf-on-primary);font-size:25px;letter-spacing:-.035em;line-height:1.02}.scout-cover p{margin:2mm 0 0;color:var(--pdf-on-primary);font-size:9px}.scout-cover-meta{max-width:42%;border:1px solid var(--pdf-on-primary);border-radius:999px;background:rgba(255,255,255,.10);color:var(--pdf-on-primary);padding:2mm 3mm;text-align:right;font-size:7px;line-height:1.4}.scout-kicker{display:inline-block;margin-bottom:2mm;border-radius:999px;background:rgba(255,255,255,.10);color:var(--pdf-on-primary);font-size:6px;font-weight:800;letter-spacing:.16em;padding:1mm 2mm;text-transform:uppercase}
.scout-section{margin:0 0 6mm;break-inside:auto}.scout-section.keep{page-break-inside:avoid}.scout-section-title{display:flex;align-items:center;gap:2mm;margin:0 0 3mm;border-left:0;border-radius:2mm;padding:2mm 3mm;background:linear-gradient(90deg,var(--pdf-primary-light),var(--pdf-surface));color:var(--pdf-ink);font-size:14px;letter-spacing:-.02em;line-height:1.1;page-break-after:avoid}.scout-section-title::after{flex:1;height:1px;margin-left:2mm;background:linear-gradient(90deg,var(--pdf-primary-border),transparent);content:""}.scout-subtitle{display:flex;align-items:center;gap:2mm;margin:4mm 0 2mm;color:var(--pdf-ink);font-size:11px;page-break-after:avoid}.scout-subtitle::before{display:block;width:5mm;height:1mm;border-radius:999px;background:var(--pdf-primary);content:""}
.scout-table{width:100%;border-collapse:collapse;table-layout:fixed;page-break-inside:auto}.scout-table thead{display:table-header-group}.scout-table tr{page-break-inside:avoid}.scout-table th,.scout-table td{border:1px solid var(--pdf-line);padding:2mm;vertical-align:middle;overflow-wrap:anywhere}.scout-table th{background:var(--pdf-primary);color:var(--pdf-on-primary);font-size:7px;letter-spacing:.02em;text-align:center}.scout-table td{background:#fff}.scout-table tbody tr:nth-child(even) td{background:var(--pdf-surface)}.scout-table .label{width:26%;background:var(--pdf-primary-light);color:var(--pdf-primary-dark);font-weight:800}.scout-table .center{text-align:center}.scout-table .numeric{text-align:center;font-weight:800}
.scout-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3mm}.scout-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.scout-card{position:relative;overflow:hidden;border:1px solid var(--pdf-line);border-radius:3mm;background:linear-gradient(145deg,#fff,#fafbfd);padding:3.5mm;page-break-inside:avoid}.scout-card::after{position:absolute;inset:auto 3mm 0;height:.6mm;border-radius:999px;background:linear-gradient(90deg,var(--pdf-primary),transparent);content:""}.scout-card h3{margin:0 0 1.5mm;color:var(--pdf-ink);font-size:10px}.scout-card p:last-child{margin-bottom:0}.scout-card.positive{border-top:1.2mm solid #2b8a66;background:linear-gradient(145deg,#fff,#f2fbf7)}.scout-card.negative{border-top:1.2mm solid #c44b4b;background:linear-gradient(145deg,#fff,#fff6f6)}.scout-card.accent{background:linear-gradient(145deg,var(--pdf-primary-light),#fff)}
.scout-list{margin:0;padding-left:4.5mm}.scout-list li{margin:0 0 1.2mm}.scout-muted{color:#64748b}.scout-empty{border:1px dashed #c7d1dc;padding:4mm;color:#64748b;text-align:center}
.scout-player{display:grid;grid-template-columns:25mm minmax(0,1fr);gap:3mm;align-items:center}.scout-photo{display:block;width:23mm;height:27mm;border:1mm solid #fff;border-radius:3mm;background:#e4e8ec;box-shadow:0 0 0 .3mm var(--pdf-line);object-fit:cover}.scout-avatar{display:grid;width:23mm;height:27mm;place-items:center;border-radius:3mm;background:linear-gradient(145deg,var(--pdf-primary-dark),var(--pdf-primary));color:var(--pdf-on-primary);font-size:16px;font-weight:900}.scout-player h3{font-size:12px;letter-spacing:-.02em}.scout-meta{display:flex;flex-wrap:wrap;gap:1.5mm;margin-top:1.5mm}.scout-meta span{border:1px solid var(--pdf-primary-border);border-radius:999px;background:var(--pdf-primary-light);padding:1mm 2mm;color:var(--pdf-primary-dark);font-size:7px;font-weight:800}
.scout-lineup{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2mm}.scout-lineup article{text-align:center}.scout-lineup .scout-photo,.scout-lineup .scout-avatar{width:100%;height:24mm}.scout-lineup strong,.scout-lineup small{display:block;margin-top:1mm}.scout-lineup small{color:#64748b}
.scout-stat-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1.5mm}.scout-stat{position:relative;overflow:hidden;border:1px solid var(--pdf-line);border-radius:2mm;background:var(--pdf-surface);padding:2.3mm;text-align:center;page-break-inside:avoid}.scout-stat:first-child{border-color:var(--pdf-primary);background:var(--pdf-primary)}.scout-stat:first-child b,.scout-stat:first-child small{color:var(--pdf-on-primary)}.scout-stat::after{position:absolute;inset:auto 0 0;height:.6mm;background:var(--pdf-primary);content:""}.scout-stat b,.scout-stat small{display:block}.scout-stat b{color:var(--pdf-ink);font-size:13px}.scout-stat small{color:var(--pdf-muted);font-size:6px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.scout-play-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3mm}.scout-play{overflow:hidden;border:1px solid var(--pdf-line);border-radius:2.5mm;page-break-inside:avoid}.scout-play header{padding:2mm 3mm;background:var(--pdf-primary);color:var(--pdf-on-primary)}.scout-play header h3{margin:0;font-size:10px}.scout-play img{display:block;width:100%;height:42mm;padding:2mm;background:var(--pdf-surface);object-fit:contain;object-position:center}.scout-play-copy{padding:2.5mm 3mm;white-space:pre-line}
.scout-zone-layout{display:flex;justify-content:center;align-items:start}.scout-court{position:relative;width:92mm;height:80mm;overflow:hidden;background:#f2f4f6}.scout-court>img{width:100%;height:100%;object-fit:contain}.scout-zone-dot{position:absolute;display:block;width:18mm;height:18mm;border:1.5px solid #991b1b;border-radius:50%;background:rgba(220,38,38,.58);color:transparent;font-size:0;box-shadow:0 1px 4px #0003;transform:translate(-50%,-50%)}.zone-topo{left:50%;top:13%}.zone-canto_esquerdo{left:10%;top:13%}.zone-ala_direita{left:90%;top:13%;right:auto}.zone-poste_baixo_esquerdo{left:22%;top:49%}.zone-zona_central{left:50%;top:49%}.zone-poste_baixo_direito{left:78%;top:49%;right:auto}.zone-ala_esquerda{left:12%;top:84%;bottom:auto}.zone-aro{left:50%;top:80%;bottom:auto}.zone-canto_direito{left:88%;top:84%;right:auto;bottom:auto}.scout-stat-table th,.scout-stat-table td{white-space:nowrap}
.scout-summary-list{display:grid;gap:1.2mm;margin:2mm 0 0;padding:0;list-style:none}.scout-summary-list li{position:relative;border-left:1mm solid var(--pdf-primary);border-radius:0 2mm 2mm 0;background:var(--pdf-surface);padding:1.4mm 2mm 1.4mm 4mm}.scout-summary-list li::before{position:absolute;left:1.6mm;content:"\2022";color:var(--pdf-primary);font-weight:900}
.scout-page{page-break-after:always}.scout-page:last-child{page-break-after:auto}.scout-footer{display:flex;justify-content:space-between;gap:8mm;margin-top:6mm;border-top:2px solid var(--pdf-primary);padding-top:2mm;color:var(--pdf-muted);font-size:6px;font-weight:700;letter-spacing:.025em}
.pdf-rating{display:flex;align-items:center;gap:.7mm}.pdf-rating i{display:block;width:4mm;height:2.2mm;border-radius:99px;background:#d8dee6}.pdf-rating.weak i.on{background:#c94747}.pdf-rating.average i.on{background:#d59a24}.pdf-rating.strong i.on{background:#2f8a61}.pdf-rating b{margin-left:1mm;color:var(--pdf-muted);font-size:6px}.scout-rating-table tr{page-break-inside:avoid}
</style>
