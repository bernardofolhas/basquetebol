<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#243447;font-family:Arial,sans-serif;font-size:9px;line-height:1.35}
h1,h2,h3,p{margin-top:0}
.scout-cover{display:flex;min-height:35mm;align-items:flex-end;justify-content:space-between;gap:12mm;margin-bottom:7mm;border-bottom:4px solid var(--pdf-primary);padding:7mm;background:#17365d;color:#fff;page-break-inside:avoid}
.scout-cover h1{margin:0;font-size:24px;line-height:1.05}.scout-cover p{margin:2mm 0 0;color:#d9eaf7;font-size:10px}.scout-cover-meta{text-align:right;font-size:8px}.scout-kicker{font-size:7px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.scout-section{margin:0 0 6mm;break-inside:auto}.scout-section.keep{page-break-inside:avoid}.scout-section-title{margin:0 0 3mm;border-left:4px solid var(--pdf-primary);padding:2mm 3mm;background:#f2f4f6;color:#17365d;font-size:14px;line-height:1.1;page-break-after:avoid}.scout-subtitle{margin:4mm 0 2mm;color:#17365d;font-size:11px;page-break-after:avoid}
.scout-table{width:100%;border-collapse:collapse;table-layout:fixed;page-break-inside:auto}.scout-table thead{display:table-header-group}.scout-table tr{page-break-inside:avoid}.scout-table th,.scout-table td{border:1px solid #c7d1dc;padding:2mm;vertical-align:middle;overflow-wrap:anywhere}.scout-table th{background:#17365d;color:#fff;font-size:7px;letter-spacing:.02em;text-align:center}.scout-table td{background:#fff}.scout-table tbody tr:nth-child(even) td{background:#f7f9fb}.scout-table .label{width:26%;background:#eaf4f8;color:#17365d;font-weight:800}.scout-table .center{text-align:center}.scout-table .numeric{text-align:center;font-weight:800}
.scout-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3mm}.scout-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.scout-card{border:1px solid #d7e0e8;border-radius:2mm;background:#fff;padding:3mm;page-break-inside:avoid}.scout-card h3{margin:0 0 1.5mm;color:#17365d;font-size:10px}.scout-card p:last-child{margin-bottom:0}.scout-card.positive{border-top:3px solid #2b8a66}.scout-card.negative{border-top:3px solid #c44b4b}.scout-card.accent{background:#eaf4f8}
.scout-list{margin:0;padding-left:4.5mm}.scout-list li{margin:0 0 1.2mm}.scout-muted{color:#64748b}.scout-empty{border:1px dashed #c7d1dc;padding:4mm;color:#64748b;text-align:center}
.scout-player{display:grid;grid-template-columns:25mm minmax(0,1fr);gap:3mm;align-items:center}.scout-photo{display:block;width:23mm;height:27mm;border-radius:2mm;background:#e4e8ec;object-fit:cover}.scout-avatar{display:grid;width:23mm;height:27mm;place-items:center;border-radius:2mm;background:#d9eaf7;color:#17365d;font-size:16px;font-weight:900}.scout-player h3{font-size:12px}.scout-meta{display:flex;flex-wrap:wrap;gap:1.5mm;margin-top:1.5mm}.scout-meta span{border-radius:999px;background:#eaf4f8;padding:1mm 2mm;color:#17365d;font-size:7px;font-weight:800}
.scout-lineup{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2mm}.scout-lineup article{text-align:center}.scout-lineup .scout-photo,.scout-lineup .scout-avatar{width:100%;height:24mm}.scout-lineup strong,.scout-lineup small{display:block;margin-top:1mm}.scout-lineup small{color:#64748b}
.scout-stat-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1.5mm}.scout-stat{border:1px solid #d9eaf7;background:#eaf4f8;padding:2mm;text-align:center;page-break-inside:avoid}.scout-stat b,.scout-stat small{display:block}.scout-stat b{color:#17365d;font-size:12px}.scout-stat small{font-size:6px;font-weight:800;text-transform:uppercase}
.scout-play-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3mm}.scout-play{border:1px solid #d7e0e8;page-break-inside:avoid}.scout-play header{padding:2mm 3mm;background:#17365d;color:#fff}.scout-play header h3{margin:0;font-size:10px}.scout-play img{display:block;width:100%;height:55mm;background:#f2f4f6;object-fit:contain}.scout-play-copy{padding:2.5mm 3mm;white-space:pre-line}

.scout-page{page-break-after:always}.scout-page:last-child{page-break-after:auto}.scout-footer{display:flex;justify-content:space-between;gap:8mm;margin-top:5mm;border-top:1px solid #c7d1dc;padding-top:2mm;color:#64748b;font-size:7px}
</style>
