{% macro cabecalho_scouting(tipo, adversario, identidade, simbolo_adversario, resumo=none) -%}
<header class="scouting-report-header">
  <div class="scouting-report-logo">{% if identidade.logo_principal %}<img src="{{ identidade.logo_principal }}" alt="Símbolo do clube">{% endif %}</div>
  <div class="scouting-report-heading"><h1>Scouting {{ tipo }} - {{ adversario }}</h1>{% if resumo %}<p>{{ resumo|truncate(220) }}</p>{% endif %}</div>
  <div class="scouting-report-logo">{% if simbolo_adversario %}<img src="{{ simbolo_adversario }}" alt="Símbolo de {{ adversario }}">{% endif %}</div>
</header>
{%- endmacro %}
