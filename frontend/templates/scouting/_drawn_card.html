<article class="scouting-drawn-card"><a href="/playbook/studio/setplays/{{ elemento.setplay.id }}" class="scouting-drawn-preview"><img src="/static/campos/campo_meio.png" alt=""><img src="{{ elemento.preview_imagem or '' }}" alt="Desenho de {{ elemento.setplay.nome }}" {% if not elemento.preview_imagem %}hidden{% endif %}></a><div class="scouting-drawn-body"><small>Momento {{ (elemento.ordem or 0) + 1 }}</small><h3>{{ elemento.setplay.nome }}</h3><p>{{ elemento.setplay.descricao or 'Sem observações.' }}</p><div><a href="/playbook/studio/setplays/{{ elemento.setplay.id }}" class="ds-button-secondary">Editar no Studio</a><form method="POST" action="/scouting/coletivo/{{ tipo_elemento }}/{{ elemento.id }}/mover/cima" data-studio-async data-studio-refresh="collective-{{ tipo_elemento }}s"><button aria-label="Mover para cima">↑</button></form><form method="POST" action="/scouting/coletivo/{{ tipo_elemento }}/{{ elemento.id }}/mover/baixo" data-studio-async data-studio-refresh="collective-{{ tipo_elemento }}s"><button aria-label="Mover para baixo">↓</button></form><form method="POST" action="/scouting/coletivo/{{ tipo_elemento }}/{{ elemento.id }}/eliminar" data-studio-async data-studio-refresh="collective-{{ tipo_elemento }}s" onsubmit="return confirm('Eliminar apenas este elemento?')"><button class="scouting-icon-danger" aria-label="Eliminar">×</button></form></div></div></article>
