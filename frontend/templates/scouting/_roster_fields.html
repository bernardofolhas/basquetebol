<div class="scouting-form-grid"><label class="ds-label span-2">Fotografia<input type="file" name="fotografia" accept="image/png,image/jpeg" class="ds-input"></label>{% if jogador and jogador.fotografia %}<label class="scouting-check span-2"><input type="checkbox" name="remover_fotografia" value="true"> Remover fotografia atual</label>{% endif %}<label class="ds-label span-2">Nome completo<input name="nome" required maxlength="160" value="{{ jogador.nome if jogador else '' }}" class="ds-input"></label><label class="ds-label">Número<input name="numero" maxlength="12" value="{{ jogador.numero or '' if jogador else '' }}" class="ds-input"></label><label class="ds-label">Idade<input type="number" name="idade" min="12" max="60" value="{{ jogador.idade or '' if jogador else '' }}" class="ds-input"></label><label class="ds-label">Posição principal<select name="posicao_principal" required class="ds-input"><option value="">Selecionar</option>{% for posicao in posicoes %}<option {% if jogador and jogador.posicao_principal == posicao %}selected{% endif %}>{{ posicao }}</option>{% endfor %}</select></label><label class="ds-label">Posição alternativa<select name="posicao_alternativa" class="ds-input"><option value="">Sem posição alternativa</option>{% for posicao in posicoes %}<option {% if jogador and jogador.posicao_alternativa == posicao %}selected{% endif %}>{{ posicao }}</option>{% endfor %}</select></label><label class="ds-label">Altura (cm)<input type="number" step="0.1" min="120" max="250" name="altura_cm" value="{{ jogador.altura_cm or '' if jogador else '' }}" class="ds-input"></label><label class="ds-label">Peso (kg)<input type="number" step="0.1" min="30" max="250" name="peso_kg" value="{{ jogador.peso_kg or '' if jogador else '' }}" class="ds-input"></label><label class="ds-label">Equipa anterior<input name="equipa_anterior" value="{{ jogador.equipa_anterior or '' if jogador else '' }}" class="ds-input"></label><label class="ds-label">Estado<select name="estado" class="ds-input">{% for estado in estados_jogador %}<option value="{{ estado }}" {% if jogador and jogador.estado == estado %}selected{% endif %}>{{ estado|capitalize }}</option>{% endfor %}</select></label><label class="ds-label">Mão dominante<select name="mao_dominante" class="ds-input"><option value="">Por definir</option>{% for mao in ['Direita','Esquerda','Ambidestro'] %}<option {% if jogador and jogador.mao_dominante == mao %}selected{% endif %}>{{ mao }}</option>{% endfor %}</select></label><label class="ds-label span-2">Notas<textarea name="observacoes" rows="3" class="ds-textarea">{{ jogador.observacoes or '' if jogador else '' }}</textarea></label></div>
